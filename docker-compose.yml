# 起動したいコンテナを定義。app（Node.js + Express）、mysql、phpmyadmin の3つ
services:
  # Node.js + Express（WebAPI・WebSocket・画面の配信）の定義
  app:
    build:
      # Dockerfile を格納するフォルダのパス
      context: ./docker/app
      # Dockerfile のファイル名
      dockerfile: Dockerfile
    # 起動するたびにパッケージを揃え、Prisma Client を作ってから tsx で起動（変更時に自動再起動）
    command: sh -c "npm install && npx prisma generate && npm run dev"
    # ホストマシンのポートをコンテナのポートにマッピング
    ports:
      # <ホストマシンのポート>:<コンテナのポート>
      - 3000:3000
    volumes:
      # ./app フォルダをコンテナ内の /app にマウント
      - ./app:/app
      # node_modules はコンテナ専用にする（Windows 側のものと混ざらないように）
      # 名前付きボリュームなので、docker compose down しても残り、次の起動が速い
      - app_node_modules:/app/node_modules
    environment:
      PORT: 3000
      # Prisma が MySQL に接続するための URL（ホスト名は mysql サービス名）
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      # タイトル自動補完の日付（メモ(YYYY-MM-DD)）を日本時間にする
      TZ: Asia/Tokyo
      # Windows のフォルダをマウントするとファイル変更の通知が届かないので、
      # tsx watch に定期的な確認（ポーリング）で変更を検知させる
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    # MySQL が起動しきってから起動する
    depends_on:
      mysql:
        condition: service_healthy
  # MySQL の定義
  mysql:
    # MySQL コンテナに使用するイメージを指定
    image: mysql:8.4.8
    # コンテナ内で使用される環境変数を定義
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Tokyo
    volumes:
      # 名前付きボリュームを MySQL コンテナに紐づける
      - mysqldata:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
      # ボリュームを初めて作るときに実行するスクリプト
      - ./docker/mysql/initdb:/docker-entrypoint-initdb.d
    ports:
      - 3306:3306
    # 接続できる状態になったかを確認する
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
  # phpMyAdmin の定義
  phpmyadmin:
    image: phpmyadmin:5.2.3
    environment:
      # 接続先の MySQL（サービス名）
      PMA_HOST: mysql
    ports:
      - 8080:80
    depends_on:
      - mysql
volumes:
  # 名前付きボリュームの作成
  mysqldata:
  app_node_modules:
